<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LearnX First Admin Setup</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f6ff;font-family:Arial,sans-serif;color:#182342}.card{width:min(92vw,480px);background:white;padding:32px;border-radius:18px;box-shadow:0 15px 45px #18234218}h1{margin:0 0 8px}p{color:#65718c;line-height:1.5}label{display:block;margin:16px 0 6px;font-weight:600}input{width:100%;padding:13px;border:1px solid #d8deed;border-radius:9px;font-size:15px}button{margin-top:22px;width:100%;padding:14px;background:#655cf6;color:white;border:0;border-radius:9px;font-weight:700;cursor:pointer}#result{margin-top:16px;white-space:pre-wrap;line-height:1.5}
</style></head><body><main class="card"><h1>LearnX — First Admin</h1><p>One-time setup. This page works only while no admin account exists and the setup key is enabled on the backend.</p><form id="setup"><label>Setup key</label><input id="key" type="password" required autocomplete="off"><label>Admin name</label><input id="name" required minlength="2"><label>Admin email</label><input id="email" type="email" required><label>Strong password</label><input id="password" type="password" required minlength="12" autocomplete="new-password"><button>Create first admin</button></form><div id="result" role="status"></div></main><script src="../JS/mysql-config.js"></script><script>
document.getElementById('setup').addEventListener('submit',async e=>{e.preventDefault();const out=document.getElementById('result');out.textContent='Creating admin…';try{const r=await fetch(`${window.LEARNX_API_BASE_URL}/api/setup/initial-admin`,{method:'POST',headers:{'Content-Type':'application/json','X-Setup-Key':document.getElementById('key').value},body:JSON.stringify({name:document.getElementById('name').value,email:document.getElementById('email').value,password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Setup failed');out.textContent=d.message+' You can now sign in.';e.target.reset()}catch(err){out.textContent=err.message}});
</script></body></html>
