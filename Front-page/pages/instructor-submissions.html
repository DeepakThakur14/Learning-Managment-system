<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Submissions | LearnX</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="../CSS/style.css"><link rel="stylesheet" href="../CSS/lms.css"></head><body><main class="container py-5"><div class="d-flex justify-content-between"><div><h1>Student Submissions</h1><p class="text-muted">Review and grade work submitted for your courses.</p></div><a href="instructor-dashboard.html" class="btn btn-outline-secondary align-self-start">Back to dashboard</a></div><div class="card p-3"><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Student</th><th>Assignment</th><th>Submitted file</th><th>Comments</th><th>Grade</th><th>Feedback</th><th></th></tr></thead><tbody id="submissionRows"></tbody></table></div></div></main><script src="../JS/data.js"></script><script src="../JS/auth.js"></script><script>
document.addEventListener("DOMContentLoaded",()=>{const me=LMSStorage.getCurrentUser();if(!me||me.role!=="instructor")return;const ownCourses=CourseService.getCoursesByInstructor(me.id).concat(CourseService.getCoursesByInstructor(me.name));const ids=new Set(ownCourses.map(c=>c.id));const rows=document.getElementById("submissionRows");function render(){const data=AssignmentService.getInstructorSubmissions(me.id).filter(s=>ids.has(s.courseId));rows.innerHTML=data.map(s=>`<tr><td>${s.studentName}<br><small>${s.studentEmail}</small></td><td>${s.assignmentTitle}</td><td>${s.fileName||"—"}</td><td>${s.comments||"—"}</td><td><input class="form-control form-control-sm" style="width:90px" id="grade-${s.id}" value="${s.grade??""}" placeholder="Grade"></td><td><input class="form-control form-control-sm" id="feedback-${s.id}" value="${s.feedback||""}" placeholder="Feedback"></td><td><button class="btn btn-sm btn-primary" data-grade="${s.id}">Save</button></td></tr>`).join("")||'<tr><td colspan="7" class="text-center text-muted">No submissions for your courses yet.</td></tr>';document.querySelectorAll("[data-grade]").forEach(b=>b.onclick=()=>{const id=b.dataset.grade;AssignmentService.gradeSubmission(id,document.getElementById("grade-"+id).value,document.getElementById("feedback-"+id).value);alert("Grade and feedback saved.");render()})}render()});
</script></body></html>
