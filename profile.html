<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>
    <link rel="stylesheet" href="css/student.css">
</head>
<body>

<header class="navbar">
    <div class="logo">Learn<span>Hub</span></div>

    <nav>
        <a href="student-dashboard.html">Dashboard</a>
        <a href="my-courses.html">My Courses</a>
        <a href="progress.html">Progress</a>
        <a href="assignments.html">Assignments</a>
        <a href="certificates.html">Certificates</a>
        <a href="profile.html" class="active">Profile</a>
    </nav>

    <div class="user">
        <div class="avatar">ST</div>
        <span>Student</span>
    </div>
</header>

<main class="container">

    <div class="page-title">
        <h1>My Profile</h1>
        <p>View your personal and learning information.</p>
    </div>

    <section class="profile-layout">

        <div class="card profile-card">

            <div class="profile-avatar">ST</div>

            <h2>Student</h2>
            <p>ABC </p>

            <div class="profile-line"></div>

            <div class="profile-detail">
                <span>Email</span>
                <strong>student@example.com</strong>
            </div>

            <div class="profile-detail">
                <span>Roll Number</span>
                <strong>123XXXXXX</strong>
            </div>

            <div class="profile-detail">
                <span>Course</span>
                <strong>XYZ</strong>
            </div>

            <div class="profile-detail">
                <span>Year</span>
                <strong>XX</strong>
            </div>

        </div>

        <div class="card">

            <div class="card-header">
                <h2>Personal Information</h2>
            </div>

            <form>

                <div class="form-row">
                    <div class="form-group">
                        <label>First Name</label>
                        <input type="text" value="Student">
                    </div>

                    <div class="form-group">
                        <label>Last Name</label>
                        <input type="text" value="User">
                    </div>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" value="student@example.com">
                </div>

                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="text" value="+91 XXXXX XXXXX">
                </div>

                <div class="form-group">
                    <label>About Me</label>
                    <textarea rows="5">Talented Student</textarea>
                </div>

                <button type="submit" class="btn">Save Changes</button>

            </form>

        </div>

    </section>

</main>

<footer>
    <p>© 2026 LearnHub LMS. All Rights Reserved.</p>
</footer>

</body>
</html>
